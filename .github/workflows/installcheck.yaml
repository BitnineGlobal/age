name: Build / Regression

on:
  push:
    branches: [ "master", "merge", "dev" ]
  pull_request:
    branches: [ "master", "merge", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg_version: [13, 14, 15, 16]

    steps:
      - name: Get latest commit id of PostgreSQL ${{ matrix.pg_version }}
        run: |
          echo "PG_COMMIT_HASH=$(git ls-remote git://git.postgresql.org/git/postgresql.git refs/heads/REL_${{ matrix.pg_version }}_STABLE | awk '{print $1}')" >> $GITHUB_ENV

      - name: Cache PostgreSQL ${{ matrix.pg_version }}
        uses: actions/cache@v3
        id: pg_cache
        with:
          path: ~/pg${{ matrix.pg_version }}
          key: ${{ runner.os }}-v1-pg${{ matrix.pg_version }}-${{ env.PG_COMMIT_HASH }}

      - name: Install PostgreSQL ${{ matrix.pg_version }} and some extensions
        if: steps.pg_cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch REL_${{ matrix.pg_version }}_STABLE git://git.postgresql.org/git/postgresql.git ~/pg${{ matrix.pg_version }}source
          cd ~/pg${{ matrix.pg_version }}source
          ./configure --prefix=$HOME/pg${{ matrix.pg_version }} CFLAGS="-std=gnu99 -ggdb -O0" --enable-cassert
          make install -j$(nproc) > /dev/null
          cd contrib
          cd fuzzystrmatch
          make PG_CONFIG=$HOME/pg${{ matrix.pg_version }}/bin/pg_config install -j$(nproc) > /dev/null
          cd ../pg_trgm
          make PG_CONFIG=$HOME/pg${{ matrix.pg_version }}/bin/pg_config install -j$(nproc) > /dev/null

      - uses: actions/checkout@v3

      - name: Build AGE
        id: build
        run: |
          make PG_CONFIG=$HOME/pg${{ matrix.pg_version }}/bin/pg_config install -j$(nproc)

      - name: Pull and build pgvector
        id: pgvector
        run: |
          git clone https://github.com/pgvector/pgvector.git
          cd pgvector
          make PG_CONFIG=$HOME/pg${{ matrix.pg_version }}/bin/pg_config install -j$(nproc) > /dev/null

      - name: Regression tests
        id: regression_tests
        run: |
          make PG_CONFIG=$HOME/pg${{ matrix.pg_version }}/bin/pg_config installcheck EXTRA_TESTS="pgvector fuzzystrmatch pg_trgm"
        continue-on-error: true

      - name: Dump regression test errors
        if: steps.regression_tests.outcome != 'success'
        run: |
          echo "Dump section begin."
          cat $HOME/work/age/age/regress/regression.diffs
          echo "Dump section end."
          exit 1
